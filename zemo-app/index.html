        <div class="field full"><button class="btn" type="submit" data-fi="Tallenna asetukset" data-en="Save Settings">Tallenna asetukset</button></div>
      </form>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="shared.js"><\/script>
<script>
let lang = 'fi';
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3200);
}

function renderAll() {
  const state = ZemoStore.get();
  const p = state.pricing;

  // Pricing inputs & dash
  $('inBase').value = p.base;
  $('inRate').value = p.rate;
  $('inFee').value = p.fee;
  $('inVat').value = p.vat;
  $('inDriverShare').value = p.driverShare;

  $('dashBase').textContent = ZemoStore.fmtEur(p.base);
  $('dashRate').textContent = ZemoStore.fmtEur(p.rate).replace(' €', ' €/km');
  $('dashFee').textContent = ZemoStore.fmtEur(p.fee);
  $('dashVat').textContent = p.vat + ' %';
  updateSim();

  // Stats
  const gross = state.orders.reduce((acc, o) => acc + Number(o.price || 0), 0);
  const dPays = state.orders.reduce((acc, o) => acc + Number(o.driverPay || 0), 0);
  $('statOrders').textContent = state.orders.length;
  $('statRev').textContent = ZemoStore.fmtEur(gross);
  $('statMargin').textContent = ZemoStore.fmtEur(gross - dPays);
  $('statDrivers').textContent = state.drivers.filter(d => d.status === 'active').length;

  // Expired jobs (time passed without a driver) – removed from the driver lists, handled here.
  const expired = state.orders.map((o, i) => ({ o, i })).filter(x => ZemoStore.isExpired(x.o));
  const tomorrow = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  $('expiredTable').innerHTML = expired.length ? expired.map(({ o, i }) => `
    <tr>
      <td><b>#${o.id}</b></td>
      <td>${o.from} → ${o.to}<br><small style="color:var(--muted)">${o.car} · ${o.km} km</small></td>
      <td><span class="pill red">${ZemoStore.fmtDate(o.date)}${o.time ? ' klo ' + o.time : ''}</span></td>
      <td><div style="display:flex;gap:6px;flex-wrap:wrap">
        <input class="res-input" type="date" id="resDate-${i}" value="${tomorrow}" aria-label="Date">
        <input class="res-input" type="time" id="resTime-${i}" value="${o.time || '09:00'}" aria-label="Time">
      </div></td>
      <td><div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn sm green" onclick="rescheduleOrder(${i})">${lang === 'fi' ? 'Julkaise uudelleen' : 'Republish'}</button>
        <button class="btn sm" onclick="assignDriver(${i})">${lang === 'fi' ? 'Kiinnitä Mikko' : 'Assign Mikko'}</button>
      </div></td>
    </tr>
  `).join('') : `<tr><td colspan="5" style="color:var(--muted)">${lang === 'fi' ? 'Ei myöhästyneitä tehtäviä.' : 'No expired jobs.'}</td></tr>`;

  // Orders Table
  $('ordersTable').innerHTML = state.orders.map((o, i) => `
    <tr>
      <td><b>#${o.id}</b></td>
      <td>${o.from} → ${o.to}<br><small style="color:var(--muted)">${o.car} · ${o.km} km</small></td>
      <td>${o.customer}</td>
      <td>${o.driver || '—'}</td>
      <td><b>${ZemoStore.fmtEur(o.price)}</b></td>
      <td>
        ${ZemoStore.isExpired(o) ? `<span class="pill red">${lang === 'fi' ? 'Aika umpeutunut' : 'Expired'}</span>` :
          o.status === 'new' ? '<span class="pill orange">Uusi</span>' :
          o.status === 'transit' ? '<span class="pill blue">Kuljetuksessa</span>' :
          '<span class="pill green">Toimitettu</span>'}
      </td>
      <td>
        ${o.status === 'new' ? `<button class="btn sm" onclick="assignDriver(${i})">${lang === 'fi' ? 'Kiinnitä Mikko' : 'Assign Mikko'}</button>` :
          o.status === 'transit' ? `<button class="btn sm green" onclick="markDone(${i})">${lang === 'fi' ? 'Valmis' : 'Complete'}</button>` : '—'}
      </td>
    </tr>
  `).join('');

  // Drivers Table
  $('driversTable').innerHTML = state.drivers.map((d, i) => `
    <tr>
      <td><b>${d.name}</b></td>
      <td>${d.contact}</td>
      <td>${d.licence}</td>
      <td>${d.trips}</td>
      <td>${d.status === 'active' ? '<span class="pill green">Aktiivinen</span>' : '<span class="pill orange">Odottaa</span>'}</td>
      <td>
        ${d.status === 'pending'
          ? `<button class="btn sm green" onclick="toggleDriver(${i}, 'active')">${lang === 'fi' ? 'Hyväksy' : 'Approve'}</button>`
          : `<button class="btn sm outline" onclick="toggleDriver(${i}, 'pending')">${lang === 'fi' ? 'Keskeytä' : 'Suspend'}</button>`}
      </td>
    </tr>
  `).join('');

  // Payments Table
  $('paymentsTable').innerHTML = state.payouts.map((pay, i) => `
    <tr>
      <td>#${pay.id}</td>
      <td>${pay.driver}</td>
      <td><code>${pay.iban}</code></td>
      <td><b>${ZemoStore.fmtEur(pay.amount)}</b></td>
      <td>${pay.status === 'paid' ? '<span class="pill green">Maksettu</span>' : '<span class="pill orange">Odottaa</span>'}</td>
      <td>
        ${pay.status === 'pending'
          ? `<button class="btn sm green" onclick="payDriver(${i})">${lang === 'fi' ? 'Maksa nyt' : 'Pay Now'}</button>`
          : '✓'}
      </td>
    </tr>
  `).join('');
}

// Expired job: publish again to drivers with a new date and time.
window.rescheduleOrder = function(i) {
  const state = ZemoStore.get();
  const o = state.orders[i];
  if (!o) return;
  const date = $('resDate-' + i).value, time = $('resTime-' + i).value;
  if (!date || !time || new Date(date + 'T' + time + ':00') <= new Date()) {
    toast(lang === 'fi' ? 'Valitse tuleva päivä ja kellonaika.' : 'Choose a future date and time.');
    return;
  }
  o.date = date;
  o.time = time;
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? `Tehtävä #${o.id} julkaistu uudelleen kuljettajille.` : `Job #${o.id} republished to drivers.`);
};

// Re-check every minute so newly expired jobs appear here.
setInterval(() => {
  const a = document.activeElement;
  if (!$('appView').classList.contains('hidden') && !(a && a.matches('input, select, textarea'))) renderAll();
}, 60000);

window.assignDriver = function(i) {
  const state = ZemoStore.get();
  state.orders[i].driver = 'Mikko Virtanen';
  state.orders[i].status = 'transit';
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? `Kuljettaja kiinnitetty tilaukseen #${state.orders[i].id}` : `Driver assigned to #${state.orders[i].id}`);
};

window.markDone = function(i) {
  const state = ZemoStore.get();
  const o = state.orders[i];
  o.status = 'delivered';
  state.payouts.unshift({
    id: o.id,
    driver: o.driver || 'Mikko Virtanen',
    iban: 'FI21 1234 5600 0007 85',
    amount: o.driverPay,
    status: 'pending'
  });
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? `Tilaus #${o.id} merkitty toimitetuksi.` : `Order #${o.id} marked delivered.`);
};

window.toggleDriver = function(i, st) {
  const state = ZemoStore.get();
  state.drivers[i].status = st;
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? 'Kuljettajan tila päivitetty.' : 'Driver status updated.');
};

window.payDriver = function(i) {
  const state = ZemoStore.get();
  state.payouts[i].status = 'paid';
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? 'Tilitys merkitty maksetuksi.' : 'Payout marked paid.');
};

window.resetDemoData = function() {
  ZemoStore.reset();
  renderAll();
  toast(lang === 'fi' ? 'Oletusdata palautettu kaikkiin näkymiin.' : 'Default demo data restored.');
};

function updateSim() {
  const b = Number($('inBase').value) || 0;
  const r = Number($('inRate').value) || 0;
  const f = Number($('inFee').value) || 0;
  const share = (Number($('inDriverShare').value) || 75) / 100;
  const total = b + (r * 150) + f;
  const dPay = total * share;
  const margin = total - dPay;
  $('simCustPrice').textContent = ZemoStore.fmtEur(total);
  $('simDriverPay').textContent = ZemoStore.fmtEur(dPay);
  $('simMargin').textContent = ZemoStore.fmtEur(margin);
}
['inBase', 'inRate', 'inFee', 'inDriverShare'].forEach(id => $(id).addEventListener('input', updateSim));

$('pricingForm').addEventListener('submit', e => {
  e.preventDefault();
  const state = ZemoStore.get();
  state.pricing = {
    base: Number($('inBase').value) || 0,
    rate: Number($('inRate').value) || 0,
    fee: Number($('inFee').value) || 0,
    vat: Number($('inVat').value) || 25.5,
    driverShare: Number($('inDriverShare').value) || 75
  };
  ZemoStore.save(state);
  renderAll();
  toast(lang === 'fi' ? 'Hinnoittelu tallennettu ja synkronoitu!' : 'Pricing saved and synced across portals!');
});

$('settingsForm').addEventListener('submit', e => {
  e.preventDefault();
  toast(lang === 'fi' ? 'Järjestelmäasetukset tallennettu.' : 'System settings saved.');
});

function switchTab(id) {
  document.querySelectorAll('#adminNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== id));
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
  $('adminBadge').classList.remove('hidden');
  renderAll();
  toast(lang === 'fi' ? 'Kirjauduttu ylläpitonäkymään.' : 'Logged into Admin Control.');
});

$('logoutBtn').addEventListener('click', () => {
  $('appView').classList.add('hidden');
  $('logoutBtn').classList.add('hidden');
  $('adminBadge').classList.add('hidden');
  $('loginView').classList.remove('hidden');
});

document.querySelectorAll('#adminNav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
window.addEventListener('storage', renderAll);

$('langBtn').addEventListener('click', () => {
  lang = lang === 'fi' ? 'en' : 'fi';
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'fi' ? 'EN' : 'FI';
  document.querySelectorAll('[data-fi]').forEach(el => {
    if (el.dataset[lang]) el.textContent = el.dataset[lang];
  });
  renderAll();
});
<\/script>
</body>

</script>

<script>
(function () {
  var NAMES = ['index', 'start', 'customer', 'driver', 'admin'];
  var frames = {};
  // Undo the storage escapes. Written split up so this script never contains a closing script tag or comment opener.
  var CLOSE = '<' + '/script', OPEN_COMMENT = '<' + '!--';
  var restore = function (s) { return s.split('<\\/script').join(CLOSE).split('<\\!--').join(OPEN_COMMENT); };
  var shared = document.getElementById('shared-js').textContent;
  var links = document.getElementById('links-js').textContent;

  function build(name) {
    var html = restore(document.getElementById('page-' + name).textContent);
    html = html.replace('<script src="shared.js">' + CLOSE + '>', '<script>' + shared + CLOSE + '>');
    html = html.replace(/<\/body>/i, '<script>' + links + '<\/script></body>');
    var f = document.createElement('iframe');
    f.className = 'page';
    f.allow = 'camera';
    f.title = name;
    f.srcdoc = html;
    document.body.appendChild(f);
    var vp = html.match(/<meta name="viewport" content="([^"]*)"/i);
    var title = html.match(/<title>([^<]*)<\/title>/i);
    frames[name] = { el: f, viewport: vp ? vp[1] : 'width=device-width,initial-scale=1', title: title ? title[1] : 'Zemo Siirto' };
    return frames[name];
  }

  function show() {
    var name = location.hash.replace('#', '');
    if (NAMES.indexOf(name) < 0) name = 'index';
    var p = frames[name] || build(name);
    NAMES.forEach(function (n) { if (frames[n]) frames[n].el.classList.toggle('active', n === name); });
    document.getElementById('vp').setAttribute('content', p.viewport);
    document.title = p.title;
    p.el.focus();
    if (pendingLogin === name) { pendingLogin = null; signIn(p.el); }
  }

  // "Kirjaudu" on the main page opens the driver page signed in: submit that page's own login form.
  var pendingLogin = null;
  function signIn(frame) {
    function run() {
      var d = frame.contentDocument, form = d && d.getElementById('loginForm'), view = d && d.getElementById('loginView');
      if (form && view && !view.classList.contains('hidden')) form.requestSubmit();
    }
    var d = frame.contentDocument;
    if (d && d.readyState === 'complete' && d.getElementById('loginForm')) run();
    else frame.addEventListener('load', run, { once: true });
  }

  window.addEventListener('message', function (e) {
    if (!e.data || NAMES.indexOf(e.data.zemoGo) < 0) return;
    if (e.data.login) pendingLogin = e.data.zemoGo;
    // After a driver logs out, load the swipe page fresh so it looks exactly like the first start.
    if (e.data.splash && frames.start) { frames.start.el.remove(); delete frames.start; }
    if (location.hash === '#' + e.data.zemoGo) show(); else location.hash = e.data.zemoGo;
  });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
