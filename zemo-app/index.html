<script type="text/plain" id="shared-js">
/* shared.js – rebuilt (the original file was not included).
   Shared state for all pages, stored in localStorage: pricing, orders, drivers, payouts, inspections. */
(function () {
  var KEY = 'zemoSiirtoState';
  var SEED_VERSION = 5; // v2: more open jobs across Finland's regions · v3: pickup times · v4: driver news · v5: customer contacts
  function defaults() {
    var pricing = { base: 25, rate: 1.10, fee: 10, vat: 25.5, driverShare: 75 };
    function price(km) { return pricing.base + pricing.rate * km + pricing.fee; }
    function job(id, from, to, region, car, km, date, time, customer) {
      return { id: id, from: from, to: to, region: region, car: car, km: km, price: price(km), driverPay: Math.round(price(km) * 0.75), status: 'new', date: date, time: time, customer: customer, driver: '', inspected: false };
    }
    return {
      seedVersion: SEED_VERSION,
      pricing: pricing,
      orders: [
        job('ZS-1055', 'Lahti', 'Mikkeli', 'Päijät-Häme', 'BMW 320d (LHT-861)', 120, '2026-12-05', '10:30', 'Autoliike Laakkonen Oy'),
        job('ZS-1054', 'Kajaani', 'Kuopio', 'Kainuu', 'Hyundai Tucson (KAJ-433)', 170, '2026-12-04', '08:00', 'Matti Meikäläinen'),
        job('ZS-1053', 'Turku', 'Salo', 'Varsinais-Suomi', 'Mazda CX-5 (TKU-275)', 55, '2026-12-03', '13:15', 'Aino Korhonen'),
        job('ZS-1052', 'Vantaa', 'Porvoo', 'Uusimaa', 'Tesla Model Y (VAN-640)', 40, '2026-12-02', '09:45', 'Autoliike Laakkonen Oy'),
        job('ZS-1051', 'Pori', 'Tampere', 'Satakunta', 'Nissan Leaf (POR-902)', 115, '2026-12-01', '07:30', 'Matti Meikäläinen'),
        job('ZS-1050', 'Kotka', 'Lappeenranta', 'Kymenlaakso', 'Skoda Superb (KTK-118)', 105, '2026-11-30', '11:00', 'Aino Korhonen'),
        job('ZS-1049', 'Jyväskylä', 'Helsinki', 'Keski-Suomi', 'Audi A4 (JKL-746)', 270, '2026-11-29', '06:45', 'Autoliike Laakkonen Oy'),
        job('ZS-1048', 'Vaasa', 'Seinäjoki', 'Pohjanmaa', 'Ford Focus (VAA-330)', 80, '2026-11-28', '14:30', 'Matti Meikäläinen'),
        job('ZS-1047', 'Kuopio', 'Joensuu', 'Pohjois-Savo', 'Kia Ceed (KUO-551)', 135, '2026-11-27', '12:00', 'Aino Korhonen'),
        job('ZS-1046', 'Rovaniemi', 'Kemi', 'Lappi', 'Toyota RAV4 (ROI-207)', 115, '2026-11-26', '09:00', 'Autoliike Laakkonen Oy'),
        job('ZS-1045', 'Tampere', 'Oulu', 'Pirkanmaa', 'Volvo V90 (TRE-889)', 490, '2026-11-26', '07:00', 'Matti Meikäläinen'),
        job('ZS-1044', 'Espoo', 'Turku', 'Uusimaa', 'VW Passat (EPS-412)', 165, '2026-11-25', '15:30', 'Aino Korhonen'),
        { id: 'ZS-1043', from: 'Lahti', to: 'Jyväskylä', region: 'Päijät-Häme', car: 'Skoda Octavia (XYZ-987)', km: 170, price: price(170), driverPay: 165, status: 'new', date: '2026-11-24', time: '10:00', customer: 'Matti Meikäläinen', driver: '', inspected: false },
        { id: 'ZS-1042', from: 'Helsinki', to: 'Tampere', region: 'Uusimaa', car: 'Toyota Corolla (ABC-123)', km: 180, price: price(180), driverPay: 175, status: 'new', date: '2026-11-23', time: '08:30', customer: 'Aino Korhonen', driver: '', inspected: false },
        { id: 'ZS-1041', from: 'Turku', to: 'Pori', region: 'Varsinais-Suomi', car: 'VW Golf (GOLF-1)', km: 140, price: price(140), driverPay: Math.round(price(140) * 0.75), status: 'transit', date: '2026-11-20', time: '09:15', customer: 'Autoliike Laakkonen Oy', driver: 'Mikko Virtanen', inspected: false }
      ],
      drivers: [
        { name: 'Mikko Virtanen', contact: '+358 40 123 4567', licence: 'B', trips: 9, status: 'active' },
        { name: 'Laura Nieminen', contact: 'laura.nieminen@esimerkki.fi', licence: 'B', trips: 0, status: 'pending' }
      ],
      // Customer contact details (shown to the driver of an accepted job). Demo data.
      customers: [
        { name: 'Aino Korhonen', type: 'private', phone: '+358 40 765 4321', email: 'aino.korhonen@esimerkki.fi' },
        { name: 'Matti Meikäläinen', type: 'private', phone: '+358 50 234 5678', email: 'matti.m@esimerkki.fi' },
        { name: 'Autoliike Laakkonen Oy', type: 'business', contactPerson: 'Jari Laakkonen', phone: '+358 44 987 6543', email: 'logistiikka@laakkonen-demo.fi' }
      ],
      payouts: [],
      inspections: [],

          en: { title: 'Check winter tyres before pickup', text: 'From December to February the car must have winter tyres. If it does not, do not drive – contact support.' } },
        { id: 'N-3', date: '2026-11-17', type: 'decision',
          fi: { title: 'Vähintään 4 kuvaa jokaisessa tarkastuksessa', text: 'Ota kuva autosta joka puolelta sekä noudossa että luovutuksessa.' },
          en: { title: 'At least 4 photos in every inspection', text: 'Photograph the car from every side at both pickup and delivery.' } },
        { id: 'N-2', date: '2026-11-14', type: 'news',
          fi: { title: 'Uusia tehtäviä Lappiin ja Kainuuseen', text: 'Siirtoja on nyt tarjolla myös Rovaniemen ja Kajaanin alueilla. Katso Hae-välilehti.' },

          fi: { title: 'Tervetuloa ZEMO-kuljettajaksi', text: 'Tältä kortilta löydät jatkossa uutiset ja uudet päätökset.' },
          en: { title: 'Welcome to ZEMO', text: 'This card shows the latest news and new decisions.' } }
      ]
    };
  }
  // Saved data from an older version: add the new demo jobs and regions, keep everything else.
  function upgrade(s) {
    var byId = {};
    s.orders.forEach(function (o) { byId[o.id] = o; });
    defaults().orders.forEach(function (o) {
      var cur = byId[o.id];
      if (cur && cur.from === o.from && cur.to === o.to) {   // same demo job: just add its region
        if (!cur.region) cur.region = o.region;
        if (!cur.time) cur.time = o.time;
        return;
      }
      if (cur) {                                             // number already used by another order
        var n = 1056;
        while (byId['ZS-' + n]) n++;
        o.id = 'ZS-' + n;
      }
      s.orders.push(o);
      byId[o.id] = o;
    });
    if (!s.news) s.news = defaults().news;
    if (!s.customers) s.customers = defaults().customers;
    s.seedVersion = SEED_VERSION;
  }
  function get() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.pricing && s.orders) {
        if (s.seedVersion !== SEED_VERSION) { upgrade(s); save(s); }
        return s;
      }
    } catch (e) {}
    return defaults();
  }
  function save(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function reset() { save(defaults()); }
  function fmtEur(n) {
    return (Number(n) || 0).toLocaleString('fi-FI', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  // Pickup moment of a job (a job without a time counts until the end of its day).
  function startTime(o) { return new Date(o.date + 'T' + (o.time || '23:59') + ':00'); }
  // An open job whose pickup time has passed without a driver: removed from the driver's lists, handled by admin.
  function isExpired(o) { return o.status === 'new' && !!o.date && startTime(o).getTime() < Date.now(); }
  // "2026-11-23" → "23.11.2026"
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[3] + '.' + m[2] + '.' + m[1] : (iso || '');
  }
  window.ZemoStore = { get: get, save: save, reset: reset, fmtEur: fmtEur, fmtDate: fmtDate, startTime: startTime, isExpired: isExpired };
})();
</script>
<script type="text/plain" id="links-js">
(function () {
  /* Single-file navigation: links to index.html / customer.html / driver.html / admin.html switch pages. */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var m = a.getAttribute('href').match(/^(index|start|customer|driver|admin)\.html(?:\?.*)?$/);
    if (!m) return;
    e.preventDefault();
    parent.postMessage({ zemoGo: m[1] }, '*');
  });
})();
</script>

.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{background:none;border:0;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;border-radius:10px}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px}
.lang-btn{width:auto;padding:0 8px;font-weight:800;font-size:13px;gap:4px;display:flex;align-items:center}

/* Menu */
.menu{position:fixed;inset:64px 0 0 0;z-index:39;background:var(--bg);padding:40px 28px;display:flex;flex-direction:column;gap:28px}
.menu a{font-size:34px;font-weight:600;text-decoration:none;color:var(--ink)}
.menu a.current{color:var(--orange)}
.menu a.small{font-size:18px;color:var(--muted);margin-top:auto}

/* Hero */
.hero{padding-top:34px;padding-bottom:10px;text-align:center}
.hero h1{font-size:clamp(28px,6.5vw,46px);line-height:1.18;margin:0 0 14px;font-weight:800}
.hero h1 .hl{color:var(--orange);text-decoration:underline;text-underline-offset:5px}
.hero p.lead{color:var(--muted);margin:0 auto 26px;max-width:620px;font-size:15px}
.calc{text-align:left;max-width:560px;margin:0 auto}
.calc label{display:block;font-weight:800;font-size:14px;margin:14px 0 8px}
.calc input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-size:15px}
.calc input:focus{outline:2px solid var(--orange);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:var(--on-orange);border:0;border-radius:12px;padding:14px 22px;font-weight:800;text-decoration:none}
.btn:hover{background:var(--orange-dark)}
.btn.block{width:100%;margin-top:18px}
.calc-msg{color:#d64545;font-size:13px;margin-top:8px;min-height:1px}
.result{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)}
.result-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px;color:var(--muted)}
.result-row b{color:var(--ink)}
.result-total{font-size:24px;font-weight:900;color:var(--ink)}
.result small{display:block;color:var(--muted);font-size:12px;margin-top:6px}

.steps{max-width:560px;margin:28px auto 0;text-align:left;display:grid;gap:16px}
.step{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--orange);color:var(--on-orange);font-weight:900;font-size:13px;display:grid;place-items:center}
.step b{display:block}
.step span{color:var(--muted);font-size:14px}

#map{height:320px;max-width:560px;margin:28px auto 0;border-radius:14px;border:1px solid var(--line);background:var(--soft);z-index:1}
.trust{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin:18px 0 40px}
.trust svg{width:18px;height:18px;color:var(--orange)}

/* Why ZEMO */
.why{padding:30px 0 60px}
.why h2{font-size:clamp(26px,5.5vw,36px);margin:0 0 26px;line-height:1.2}
.why h2 span{color:var(--orange)}
.why ol{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.why li{display:flex;gap:16px;color:var(--muted);font-size:16px}

/* Dark band */
.band{background:var(--navy);color:var(--navy-ink);padding:60px 0;border-radius:40px 40px 0 0}
.band section{padding:20px 0 34px}
.kicker{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.band h2{font-size:clamp(28px,6vw,38px);line-height:1.2;margin:10px 0 16px}
.band p{color:var(--navy-muted);max-width:620px;margin:0 0 26px}

/* Footer */
footer{padding:40px 0 30px;border-top:1px solid var(--line)}
.foot-brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:28px;letter-spacing:.08em}
.foot-brand .brand-logo{width:72px}
footer .tag{color:var(--muted);font-size:14px;margin:10px 0 18px}

<script>
const $ = id => document.getElementById(id);
let lang = 'fi';

// Finnish cities for the instant price (lat, lon).
const CITIES = {
  'Helsinki': [60.1699, 24.9384], 'Espoo': [60.2055, 24.6559], 'Vantaa': [60.2934, 25.0378], 'Porvoo': [60.3932, 25.6650],
  'Turku': [60.4518, 22.2666], 'Salo': [60.3831, 23.1286], 'Tampere': [61.4978, 23.7610], 'Hämeenlinna': [60.9959, 24.4643],
  'Lahti': [60.9827, 25.6612], 'Kotka': [60.4664, 26.9458], 'Lappeenranta': [61.0587, 28.1887], 'Mikkeli': [61.6886, 27.2723],
  'Pori': [61.4851, 21.7974], 'Rauma': [61.1272, 21.5112], 'Jyväskylä': [62.2426, 25.7473], 'Kuopio': [62.8924, 27.6770],
  'Joensuu': [62.6010, 29.7636], 'Savonlinna': [61.8687, 28.8789], 'Seinäjoki': [62.7903, 22.8403], 'Vaasa': [63.0951, 21.6165],
  'Kokkola': [63.8385, 23.1307], 'Oulu': [65.0121, 25.4651], 'Kajaani': [64.2273, 27.7285], 'Kemi': [65.7364, 24.5637],
  'Tornio': [65.8481, 24.1466], 'Rovaniemi': [66.5039, 25.7294]
};
$('cities').innerHTML = Object.keys(CITIES).map(c => `<option value="${c}">`).join('');
const findCity = v => Object.keys(CITIES).find(c => c.toLowerCase() === (v || '').trim().split(',')[0].trim().toLowerCase());

// Road distance estimate: straight line × 1.12 (close to real Finnish road distances).
function roadKm(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)) * 1.12);
}

// Map of Finland (only if the map library loaded).
let map = null, routeLayer = null;
if (window.L) {
  map = L.map('map', { scrollWheelZoom: false }).setView([64.5, 26], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
} else {
  $('map').classList.add('hidden');
}

$('calcForm').addEventListener('submit', e => {
  e.preventDefault();
  const a = findCity($('from').value), b = findCity($('to').value);
  $('calcMsg').textContent = '';
  if (!a || !b || a === b) {
    $('result').classList.add('hidden');
    $('calcMsg').textContent = lang === 'fi' ? 'Valitse kaksi eri kaupunkia listasta.' : 'Choose two different cities from the list.';
    return;
  }
  const km = roadKm(CITIES[a], CITIES[b]);
  const p = ZemoStore.get().pricing;
  const price = p.base + p.rate * km + p.fee;
  $('resRoute').textContent = a + ' → ' + b;
  $('resKm').textContent = '≈ ' + km + ' km';
  $('resPrice').textContent = ZemoStore.fmtEur(price);
  $('result').classList.remove('hidden');
  if (map) {
    if (routeLayer) routeLayer.remove();
    routeLayer = L.featureGroup([
      L.circleMarker(CITIES[a], { radius: 7, color: '#f28a45', fillOpacity: 1 }).bindTooltip(a),
      L.circleMarker(CITIES[b], { radius: 7, color: '#f28a45', fillOpacity: 1 }).bindTooltip(b),
      L.polyline([CITIES[a], CITIES[b]], { color: '#f28a45', weight: 4, dashArray: '8 8' })
    ]).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
  }
});

// Menu
function closeMenu() { $('menu').classList.add('hidden'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
$('menuBtn').addEventListener('click', () => {
  const open = $('menu').classList.toggle('hidden') === false;
  $('menuBtn').setAttribute('aria-expanded', String(open));
});
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  closeMenu();
  const id = a.getAttribute('href').slice(1);
  document.querySelectorAll('#menu a').forEach(m => m.classList.toggle('current', m === a));
  if (id === 'etusivu') window.scrollTo({ top: 0, behavior: 'smooth' });
  else { const t = $(id); window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 74, behavior: 'smooth' }); }
}));
document.querySelector('#menu a').classList.add('current');

// Theme (light / dark), remembered on this device.
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('zemoTheme', t); } catch (e) {}
}
try { if (localStorage.getItem('zemoTheme') === 'dark') setTheme('dark'); } catch (e) {}
$('themeBtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

// Language FI / EN
$('langBtn').addEventListener('click', () => {
  lang = lang === 'fi' ? 'en' : 'fi';
  document.documentElement.lang = lang;
  $('langLabel').textContent = lang.toUpperCase();
  document.querySelectorAll('[data-fi]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-fi-ph]').forEach(el => { el.placeholder = el.dataset[lang + 'Ph']; });
  if ($('calcMsg').textContent) $('calcForm').requestSubmit();
});
<\/script>
</body>
</html>

</script>

.zemo-wordmark{
  font-size:clamp(44px, 11vw, 58px);
  font-weight:900;
  letter-spacing:-.03em;
  color:#ffffff;
  margin:10px 0 0;
  line-height:1;
}

/* Swipe Track */
.swipe-wrap{
  width:min(340px, 90vw);
  margin-top:24px;
}

.swipe-track{
  position:relative;
  height:68px;
  border-radius:999px;
  background:linear-gradient(90deg, rgba(242,138,69,.16), rgba(20,27,34,.92));
  border:1.5px solid rgba(242,138,69,.65);
  box-shadow:0 0 24px rgba(242,138,69,.15), inset 0 0 14px rgba(0,0,0,.6);
  padding:5px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.swipe-fill{
  position:absolute;
  left:0;top:0;bottom:0;
  width:64px;
  background:linear-gradient(90deg, rgba(242,138,69,.35), rgba(242,138,69,.1));
  border-radius:999px;
  pointer-events:none;
}

.swipe-knob{
  position:relative;
  z-index:2;
  width:56px;
  height:56px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ff9d57, #e66e1e);
  box-shadow:0 0 20px var(--orange-glow);
  display:grid;
  place-items:center;
  cursor:grab;
  touch-action:none;
  will-change:transform;
}
.swipe-knob:active{cursor:grabbing}

/* Auto-nudge animation to center and back until touched */
@keyframes autoNudge {
  0%, 15%   { transform: translateX(0px); }
  50%       { transform: translateX(125px); }
  85%, 100% { transform: translateX(0px); }
}
.swipe-knob.auto-anim{
  animation: autoNudge 2.6s cubic-bezier(.45,.05,.55,.95) infinite;
}

/* ================= SCREEN 2: DRIVER LOGIN ================= */
.login-screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:32px 22px;
  background:radial-gradient(circle at 50% 18%, rgba(242,138,69,.1) 0%, #080c10 60%);
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.login-logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:34px;
}
.login-logo .z-emblem{width:155px}
.login-logo .zemo-wordmark{font-size:36px;margin-top:6px}

.login-box{
  width:min(380px, 100%);
  display:flex;
  flex-direction:column;
  gap:16px;
}

.clean-input{
  width:100%;
  height:56px;
  border-radius:14px;
  border:1px solid #2b3744;
  background:#151e27;
  color:#f4f7fa;
  font-size:16px;
  text-align:center;
  padding:0 18px;
  outline:none;
  transition:.18s;
}
.clean-input::placeholder{color:#9baab7;opacity:1}
.clean-input:focus{
  border-color:var(--orange);
  background:#19242f;
  box-shadow:0 0 0 3px rgba(242,138,69,.15);
}

.forgot-row{
  display:flex;
  justify-content:flex-end;
  margin-top:-4px;
}
.forgot-link{
  background:none;
  border:0;
  color:#25b8a6;
  font-size:14px;
  font-weight:700;
  padding:4px 2px;
}
.forgot-link:hover{text-decoration:underline}

.kirjaudu-btn{
  width:100%;
  height:58px;
  border:0;
  border-radius:16px;
  background:#343f4b;
  color:#ffffff;
  font-size:18px;
  font-weight:800;
  margin-top:6px;
  transition:.2s;
}
.kirjaudu-btn.ready, .kirjaudu-btn:hover{
  background:var(--orange);
  color:#17100b;
}

/* ================= SCREEN 3: DRIVER WORKSPACE ================= */
.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#0d1319;position:sticky;top:0;z-index:20}
.brand-mini{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.12em}

<script>
const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

/* ================= INTERACTIVE SWIPE LOGIC ================= */
const track = $('swipeTrack');
const knob = $('swipeKnob');
const fill = $('swipeFill');

let isDragging = false;
let startX = 0;
let currentX = 0;

function getMaxSlide() {
  return track.clientWidth - knob.clientWidth - 10;
}

function openLoginScreen() {
  $('splashScreen').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
  setTimeout(() => $('usernameInput').focus(), 100);
}

function onStart(clientX) {
  isDragging = true;
  knob.classList.remove('auto-anim');
  knob.style.transition = 'none';
  fill.style.transition = 'none';
  startX = clientX - currentX;
}

function onMove(clientX) {
  if (!isDragging) return;
  const max = getMaxSlide();
  let nextX = clientX - startX;
  nextX = Math.max(0, Math.min(nextX, max));
  currentX = nextX;
  knob.style.transform = `translateX(${currentX}px)`;
  fill.style.width = `${currentX + knob.clientWidth + 5}px`;

  if (currentX >= max * 0.82) {
    isDragging = false;
    knob.style.transition = 'transform .2s ease';
    knob.style.transform = `translateX(${max}px)`;
    setTimeout(openLoginScreen, 180);
  }
}

function onEnd() {
  if (!isDragging) return;
  isDragging = false;
  currentX = 0;
  knob.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)';
  fill.style.transition = 'width .3s cubic-bezier(.2,.8,.2,1)';
  knob.style.transform = 'translateX(0px)';
  fill.style.width = '64px';
  setTimeout(() => {
    if (!isDragging) {
      knob.style.transition = '';
      knob.classList.add('auto-anim');
    }
  }, 320);
}

knob.addEventListener('mousedown', e => onStart(e.clientX));
window.addEventListener('mousemove', e => onMove(e.clientX));
window.addEventListener('mouseup', onEnd);

knob.addEventListener('touchstart', e => onStart(e.touches[0].clientX), { passive: true });
window.addEventListener('touchmove', e => onMove(e.touches[0].clientX), { passive: true });
window.addEventListener('touchend', onEnd);

/* ================= LOGIN FORM LOGIC ================= */
function checkInputs() {
  const ready = $('usernameInput').value.trim().length > 0 && $('passwordInput').value.trim().length > 0;
  $('loginSubmitBtn').classList.toggle('ready', ready);
}
$('usernameInput').addEventListener('input', checkInputs);
$('passwordInput').addEventListener('input', checkInputs);

$('forgotBtn').addEventListener('click', () => {
  showToast('Palautuslinkki lähetetty sähköpostiisi.');
});

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  // Kirjaudu → driver page (driver.html), signed in. The password is not kept in the field.
  $('passwordInput').value = '';
  checkInputs();
  if (window.parent !== window) parent.postMessage({ zemoGo: 'driver', login: true }, '*');
  else window.location.href = 'driver.html';
});

$('logoutBtn').addEventListener('click', () => {
  $('driverPortal').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
});

/* ================= WORKSPACE TABS ================= */
document.querySelectorAll('#driverNav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#driverNav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== btn.dataset.tab));
  });
});

window.acceptDemoJob = function(btn) {
  btn.textContent = 'Valittu ✓';
  btn.disabled = true;
  btn.style.background = '#26333e';
  btn.style.color = '#9baab7';
  showToast('Tehtävä lisätty omiin tehtäviisi.');
};
<\/script>
</body>
</html>

</script>

<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}

.hidden{display:none!important}

.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));background:#0d1319;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.14em;text-decoration:none;color:inherit}
.mark{width:38px;height:38px;border:2px solid var(--orange);border-radius:11px;display:grid;place-items:center;color:var(--orange);font-size:19px;transform:skew(-7deg)}

.brand small{display:block;font-size:9px;color:var(--blue);letter-spacing:.22em}
.topright{display:flex;gap:10px;align-items:center}
.lang,.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:9px;font-size:13px;text-decoration:none}
.ghost:hover,.lang:hover{border-color:#4b5d6e}
.user-pill{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;background:#1b2836;color:var(--blue)}

.login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.login-card h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}

.wrap{width:min(1180px,calc(100% - 36px));margin:auto;padding:24px 0 60px}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.nav button{background:#151f28;color:#c3cfd9;border:1px solid var(--line);padding:10px 16px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.nav button.active{background:var(--orange);color:#17110d;border-color:var(--orange)}

.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}
.card h2{margin:0 0 6px;font-size:19px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#c3cdd5;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#0c1319;border:1px solid #34414d;color:var(--ink);border-radius:9px;padding:11px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}
.btn{border:0;border-radius:9px;background:var(--orange);color:#1b120d;font-weight:900;padding:12px 16px;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.block{width:100%;margin-top:14px}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:13px}
.stat b{font-size:24px;display:block}
.stat span{font-size:12px;color:var(--muted)}

.pricebox{background:linear-gradient(145deg,#202d38,#151d25);border:1px solid #394854;border-radius:14px;padding:20px}
.pricebox .amount{font-size:36px;font-weight:900;letter-spacing:-.04em;color:var(--orange)}
.line{height:1px;background:var(--line);margin:14px 0}
.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0;font-size:13px}

.order-item{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.order-title{font-size:16px;font-weight:800}
.order-meta{font-size:12px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;background:#26333e;color:#c9d8e3}
.pill.orange{background:#4a3021;color:#ffbd8e}
.pill.blue{background:#1b324b;color:#8ebcff}
.pill.green{background:#1c3a30;color:#a8f0ce}
.pill.red{background:#3a1d22;color:#ff9e9e}

.timeline{position:relative;padding-left:26px;margin-top:16px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.t-step{position:relative;padding-bottom:20px}
.t-step:last-child{padding-bottom:0}
.t-dot{position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--panel)}
.t-step.done .t-dot{background:var(--green)}
.t-step.active .t-dot{background:var(--orange);box-shadow:0 0 0 4px rgba(242,138,69,.22)}
.t-step strong{display:block;font-size:14px}
.t-step small{color:var(--muted);font-size:12px}

.driver-card{background:#0e151c;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.avatar{width:44px;height:44px;border-radius:50%;background:#243342;display:grid;place-items:center;font-weight:900;color:var(--orange)}

.toast{position:fixed;bottom:20px;right:20px;background:#1c3b30;border:1px solid #34795b;color:#c4f3d9;padding:13px 17px;border-radius:10px;display:none;z-index:50;max-width:340px;font-size:13px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.fields{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr}}
</style>

<script>
let lang = 'fi';
const $ = id => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3200);
}

function updateCalc() {
  const p = ZemoStore.get().pricing;
  const km = Math.max(1, Number($('inKm').value) || 0);
  const distCost = km * p.rate;
  const total = p.base + distCost + p.fee;
  $('calcBase').textContent = ZemoStore.fmtEur(p.base);
  $('calcFee').textContent = ZemoStore.fmtEur(p.fee);
  $('calcKm').textContent = km + ' km';
  $('calcDistCost').textContent = ZemoStore.fmtEur(distCost);
  $('calcTotal').textContent = ZemoStore.fmtEur(total);
}
$('inKm').addEventListener('input', updateCalc);

// "22.11.2026 klo 09:00"
const when = o => ZemoStore.fmtDate(o.date) + (o.time ? (lang === 'fi' ? ' klo ' : ' at ') + o.time : '');

function statusBadge(st, o) {
  // Pickup time passed without a driver (handled by admin).
  if (o && ZemoStore.isExpired(o)) return `<span class="pill red">${lang === 'fi' ? 'Aika umpeutunut' : 'Expired'}</span>`;
  if (st === 'new') return `<span class="pill orange">${lang === 'fi' ? 'Etsii kuljettajaa' : 'Finding Driver'}</span>`;
  if (st === 'transit') return `<span class="pill blue">${lang === 'fi' ? 'Kuljetuksessa' : 'In Transit'}</span>`;
  return `<span class="pill green">${lang === 'fi' ? 'Toimitettu' : 'Delivered'}</span>`;
}

function renderOrders() {
  const orders = ZemoStore.get().orders;
  $('activeCount').textContent = orders.filter(o => o.status !== 'delivered').length;
  $('totalOrdersCount').textContent = orders.length;
  $('ordersList').innerHTML = orders.map(o => `
    <div class="order-item">
      <div>
        <div class="order-title">#${o.id} · ${o.from} → ${o.to}</div>
        <div class="order-meta">${o.car} · ${o.km} km · ${when(o)} · <b>${ZemoStore.fmtEur(o.price)}</b></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${statusBadge(o.status, o)}
        <button class="btn outline" style="padding:8px 12px;font-size:12px" onclick="trackOrder('${o.id}')">${lang === 'fi' ? 'Seuraa' : 'Track'}</button>
      </div>
    </div>
  `).join('');
  updateCalc();
}

window.trackOrder = function(id) {
  const orders = ZemoStore.get().orders;
  const o = orders.find(x => x.id === id) || orders[0];
  if (!o) return;
  $('trackTitle').textContent = `#${o.id} · ${o.from} → ${o.to}`;
  $('trackCar').textContent = `${o.car} · ${o.km} km · ${ZemoStore.fmtEur(o.price)}`;
  $('trackStatusPill').outerHTML = statusBadge(o.status, o).replace('class="pill', 'id="trackStatusPill" class="pill');

  if (o.status === 'new') {
    $('trackTimeline').innerHTML = `
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Tilaus vastaanotettu' : 'Order Received'}</strong><small>${when(o)}</small></div>
      ${ZemoStore.isExpired(o)
        ? `<div class="t-step active"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Aika umpeutunut' : 'Expired'}</strong><small>${lang === 'fi' ? 'Kuljettajaa ei löytynyt ajoissa. Sovimme kanssasi uuden ajan.' : 'No driver was found in time. We will agree a new time with you.'}</small></div>`
        : `<div class="t-step active"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Vahvistetaan kuljettajaa' : 'Assigning Verified Driver'}</strong><small>${lang === 'fi' ? 'Tilaus näkyy nyt avoimena kuljettajille.' : 'Order is live on the driver job board.'}</small></div>`}
    `;
    $('driverBox').innerHTML = `<div class="order-meta">${lang === 'fi' ? 'Kuljettajaa ei ole vielä kiinnitetty.' : 'No driver assigned yet.'}</div>`;
  } else if (o.status === 'delivered') {
    $('trackTimeline').innerHTML = `
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Tilaus vahvistettu' : 'Order Confirmed'}</strong><small>${when(o)}</small></div>
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Auto noudettu ja tarkastettu' : 'Picked Up & Inspected'}</strong><small>OK</small></div>
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Toimitettu määränpäähän' : 'Delivered to Destination'}</strong><small>${when(o)}</small></div>
    `;
    $('driverBox').innerHTML = `<div style="display:flex;align-items:center;gap:12px"><div class="avatar">✓</div><div><strong>${o.driver || 'Mikko Virtanen'}</strong><div class="order-meta">${lang === 'fi' ? 'Kuljetus suoritettu' : 'Completed'}</div></div></div>`;
  } else {
    $('trackTimeline').innerHTML = `
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Tilaus vahvistettu' : 'Order Confirmed'}</strong><small>${when(o)}</small></div>
      <div class="t-step done"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Kuljettaja vahvistettu' : 'Driver Assigned'}</strong><small>${o.driver}</small></div>
      <div class="t-step active"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Kuljetuksessa' : 'In Transit'}</strong><small>${lang === 'fi' ? 'Reitillä kohteeseen' : 'En route to destination'} ${o.to}</small></div>
      <div class="t-step"><span class="t-dot"></span><strong>${lang === 'fi' ? 'Auto toimitettu' : 'Delivered'}</strong><small>${lang === 'fi' ? 'Odottaa luovutusta' : 'Awaiting drop-off'}</small></div>
    `;
    $('driverBox').innerHTML = `<div style="display:flex;align-items:center;gap:12px"><div class="avatar">ZS</div><div><strong>${o.driver}</strong><div class="order-meta">4.9 ★ · B-ajokortti</div></div></div><a href="tel:+358401234567" class="btn outline" style="text-decoration:none;padding:9px 12px;font-size:12px">${lang === 'fi' ? 'Soita' : 'Call'}</a>`;
  }
  switchTab('tracking');
};

function switchTab(id) {
  document.querySelectorAll('#custNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== id));
}

function enterPortal() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('logoutBtn').classList.remove('hidden');
  $('userBadge').classList.remove('hidden');
  renderOrders();
  const params = new URLSearchParams(window.location.search);
  if (params.get('track')) trackOrder(params.get('track'));
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  enterPortal();
  toast(lang === 'fi' ? 'Tervetuloa asiakasportaaliin!' : 'Welcome to Customer Portal!');
});

// Auto-enter if coming directly from index booking
if (new URLSearchParams(window.location.search).get('track')) enterPortal();

$('logoutBtn').addEventListener('click', () => {
  $('appView').classList.add('hidden');
  $('logoutBtn').classList.add('hidden');
  $('userBadge').classList.add('hidden');
  $('loginView').classList.remove('hidden');
});

document.querySelectorAll('#custNav button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

// Phone field: start with the customer's saved number (they can change it).
{
  const me = (ZemoStore.get().customers || []).find(x => x.name === 'Aino Korhonen');
  if (me && me.phone) $('inPhone').value = me.phone;
}

$('orderForm').addEventListener('submit', e => {
  e.preventDefault();
  const state = ZemoStore.get();
  const p = state.pricing;
  const km = Math.max(1, Number($('inKm').value) || 0);
  const total = p.base + (p.rate * km) + p.fee;
  const newId = 'ZS-' + (1043 + state.orders.length);
  // A phone number the driver can call: 7–15 digits.
  const phoneDigits = $('inPhone').value.replace(/\D/g, '').length;
  if (phoneDigits < 7 || phoneDigits > 15) {
    toast(lang === 'fi' ? 'Tarkista puhelinnumero.' : 'Check the phone number.');
    return;
  }
  // The pickup date and time must be in the future.
  if (new Date($('inDate').value + 'T' + $('inTime').value + ':00') <= new Date()) {
    toast(lang === 'fi' ? 'Valitse tuleva päivä ja kellonaika.' : 'Choose a future date and time.');
    return;
  }

  state.orders.unshift({
    id: newId,
    from: $('inFrom').value.trim(),
    to: $('inTo').value.trim(),
    car: `${$('inCar').value.trim()} (${$('inReg').value.trim().toUpperCase()})`,
    km: km,
    price: total,
    driverPay: Math.round(total * (p.driverShare / 100)),
    status: 'new',
    date: $('inDate').value,
    time: $('inTime').value,
    customer: 'Aino Korhonen',
    phone: $('inPhone').value.trim(),
    driver: '',
    inspected: false
  });
  ZemoStore.save(state);
  renderOrders();
  trackOrder(newId);
  toast(lang === 'fi' ? `Tilaus #${newId} luotu!` : `Order #${newId} created!`);
});

window.addEventListener('storage', renderOrders);
// Re-check every minute so an order shows "Aika umpeutunut" as soon as its time passes.
setInterval(() => { if (!$('appView').classList.contains('hidden')) renderOrders(); }, 60000);

$('langBtn').addEventListener('click', () => {
  lang = lang === 'fi' ? 'en' : 'fi';
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'fi' ? 'EN' : 'FI';
  document.querySelectorAll('[data-fi]').forEach(el => {
    if (el.dataset[lang]) el.textContent = el.dataset[lang];
  });
  renderOrders();
});
<\/script>
</body>
</html>

</script>
<script type="text/html" id="page-driver">
<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZEMO</title>
<style>
:root{
  --bg:#0b1015;--panel:#131b23;--panel2:#19232d;--line:#293642;
  --ink:#f4f7fa;--muted:#9baab7;--orange:#f28a45;--green:#6bd1a0;--blue:#8ebcff;--red:#f26b6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));background:#0d1319;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.14em;text-decoration:none;color:inherit}
.mark{width:38px;height:38px;border:2px solid var(--orange);border-radius:11px;display:grid;place-items:center;color:var(--orange);font-size:19px;transform:skew(-7deg)}
.mark-logo{height:44px;width:auto;display:block;border-radius:9px}
/* Header: logo centred, ZEMO under it */
.top{justify-content:center;height:auto;padding-top:8px;padding-bottom:8px}
.top .brand{flex-direction:column;gap:4px}
.brand-word{font-size:12px;line-height:1;letter-spacing:.22em}
.brand small{display:block;font-size:9px;color:var(--orange);letter-spacing:.22em}
.topright{display:flex;gap:10px;align-items:center}
.lang,.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:9px;font-size:13px;text-decoration:none}
.ghost:hover,.lang:hover{border-color:#4b5d6e}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800;background:#19352a;color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}

.login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.login-card h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}

.wrap{width:min(1180px,calc(100% - 36px));margin:auto;padding:24px 0 60px}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.nav button{background:#151f28;color:#c3cfd9;border:1px solid var(--line);padding:10px 15px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.nav button.active{background:var(--orange);color:#17110d;border-color:var(--orange)}

.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}
.card h2{margin:0 0 6px;font-size:19px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#c3cdd5;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#0c1319;border:1px solid #34414d;color:var(--ink);border-radius:9px;padding:11px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}
.btn{border:0;border-radius:9px;background:var(--orange);color:#1b120d;font-weight:900;padding:12px 16px;font-size:14px}
.btn:hover{filter:brightness(1.07)}
.btn.block{width:100%;margin-top:14px}
.btn.green{background:var(--green);color:#0c2218}
.btn.blue{background:var(--blue);color:#0b1a2e}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:13px}
.stat b{font-size:24px;display:block}
.stat span{font-size:12px;color:var(--muted)}

.job{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.job-route{font-size:16px;font-weight:800}
.job-meta{font-size:12px;color:var(--muted);margin-top:4px}
/* Inspection: full details of the trip being inspected */
.trip-box{border:1px solid var(--line);border-radius:12px;background:#0e151c;padding:14px 16px;margin-bottom:16px}
.trip-box .job-route{margin-bottom:10px}
.trip-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.trip-row span{color:var(--muted)}
.trip-row b{text-align:right}
.trip-title{font-size:15px;font-weight:800;margin-bottom:10px}
.contact-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.contact-btns a{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:9px;border:1px solid var(--line);background:#131b23;color:var(--ink);font-weight:800;font-size:13px;text-decoration:none}
.contact-btns a.call{background:var(--green);border-color:var(--green);color:#0b1a13}
.contact-btns svg{width:16px;height:16px}
/* Inspection photos */
.photo-title{font-size:16px;margin:6px 0 4px}
.photo-hint{margin:0 0 12px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;border:2px dashed #3a4a58;border-radius:12px;background:#0c1319;color:#c3cdd5;cursor:pointer;overflow:hidden;text-align:center;font-size:12px;font-weight:800;padding:8px}
.photo-slot.wide{aspect-ratio:auto;height:130px}
.photo-slot svg{width:66%;max-height:62%;color:#eef2f5}
.photo-slot.missing svg{color:var(--red)}
.photo-slot.wide svg{width:auto;height:70px}
.photo-slot input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.req-label::after{content:' *';color:var(--orange)}
.photo-slot.req .cap::after{content:' *';color:var(--orange)}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot.done{border-style:solid;border-color:var(--green)}
.photo-slot.done svg{display:none}
.photo-slot.done .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(5,9,12,.72);color:#fff;padding:5px;z-index:2}
.photo-slot.done::before{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#0b1a13;display:grid;place-items:center;font-size:13px;z-index:2}
.photo-slot.missing{border-color:var(--red);color:var(--red)}
.log-photos{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
/* In-app camera (opens when a photo box is tapped) */
.cam{position:fixed;inset:0;z-index:100;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;left:8%;right:8%;top:30%;bottom:30%;display:grid;place-items:center;pointer-events:none;color:rgba(255,255,255,.5)}
.cam-guide svg{width:100%;height:100%}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(rgba(0,0,0,.65),transparent);color:#fff;font-weight:800;font-size:16px}
.cam-top button{background:rgba(0,0,0,.45);border:0;color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px}
.cam-msg{position:absolute;top:38%;left:24px;right:24px;margin:0;text-align:center;color:#fff;background:rgba(0,0,0,.7);padding:16px;border-radius:12px;font-size:14px}
.cam-bar{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 24px calc(26px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.cam-shot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.3)}
.cam-shot:active{transform:scale(.92)}
.cam-shot:disabled{opacity:.35}
.cam-file{width:100px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:10px;padding:10px 8px;font-weight:800;font-size:13px}
.cam-spacer{width:100px}
.log-photos img{width:44px;height:33px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.job-pay{font-size:18px;font-weight:900;color:var(--green)}
.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#26333e;color:#c9d8e3}
.pill.orange{background:#4a3021;color:#ffbd8e}
.pill.green{background:#1c3a30;color:#a8f0ce}

.check-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#0e151c}
.check-item label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.check-item input[type="checkbox"]{width:18px;height:18px;accent-color:var(--orange)}

.nav-box{background:linear-gradient(145deg,#182430,#0f171f);border:1px solid #354759;border-radius:14px;padding:20px}
.step-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step-line:last-child{border:0}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#17110d;font-weight:900;display:grid;place-items:center;font-size:13px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-size:11px;text-transform:uppercase}

.toast{position:fixed;bottom:20px;right:20px;background:#1c3b30;border:1px solid #34795b;color:#c4f3d9;padding:13px 17px;border-radius:10px;display:none;z-index:50;max-width:340px;font-size:13px}
/* Bottom navigation (after login) */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:#0d1319;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;border-radius:10px}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button.active{color:var(--orange)}
/* Job whose date is near (see SOON_DAYS) */
.stat-link{cursor:pointer}
.stat-link:hover{border-color:var(--orange)}
.news-item{padding:14px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:0;padding-bottom:0}
.news-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.news-date{color:var(--muted);font-size:12px}
.news-title{font-weight:800;font-size:15px;margin-bottom:4px}
.news-text{color:var(--muted);font-size:13px;line-height:1.5}
.job.soon{border:2px solid var(--red);box-shadow:0 0 0 3px rgba(242,107,107,.15)}
#appView{padding-bottom:96px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}
@media(max-width:820px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.fields{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<script src="shared.js"><\/script>
<script>
let lang = 'fi';
const DRIVER_NAME = 'Mikko Virtanen';
const $ = id => document.getElementById(id);

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3200);
}

// Jobs are listed by pickup date and time (soonest first); a job starting within SOON_HOURS (or overdue) gets a red frame.
const SOON_HOURS = 24;
const startOf = j => ZemoStore.startTime(j);
const isSoon = j => !!j.date && (startOf(j) - Date.now()) / 36e5 <= SOON_HOURS;
const byTime = (x, y) => ((x.date || '9999') + (x.time || '00:00')).localeCompare((y.date || '9999') + (y.time || '00:00')) || String(x.id).localeCompare(String(y.id));
// "23.11.2026 klo 08:30"
const when = j => ZemoStore.fmtDate(j.date) + (j.time ? (lang === 'fi' ? ' klo ' : ' at ') + j.time : '');
const jobClass = j => 'job' + (isSoon(j) ? ' soon' : '');

function renderAll() {
  const state = ZemoStore.get();
  // Jobs whose time has passed are not shown to drivers (they go to admin).
  const avail = state.orders.filter(o => o.status === 'new' && !ZemoStore.isExpired(o)).sort(byTime);
  const mine = state.orders.filter(o => o.status === 'transit' && o.driver === DRIVER_NAME).sort(byTime);

  $('availCount').textContent = avail.length;
  $('myActiveCount').textContent = mine.length;

  // Koti: news and decisions, newest first; items from the last 7 days are marked new.
  const news = (state.news || []).slice().sort((x, y) => y.date.localeCompare(x.date));
  $('newsList').innerHTML = news.length ? news.map(n => {
    const t = n[lang] || n.fi;
    const fresh = (Date.now() - new Date(n.date + 'T00:00:00')) / 864e5 < 7;
    return `
    <div class="news-item">
      <div class="news-head">
        <span class="pill ${n.type === 'decision' ? 'orange' : 'green'}">${n.type === 'decision' ? (lang === 'fi' ? 'Päätös' : 'Decision') : (lang === 'fi' ? 'Uutinen' : 'News')}</span>
        ${fresh ? `<span class="pill">${lang === 'fi' ? 'Uusi' : 'New'}</span>` : ''}
        <span class="news-date">${ZemoStore.fmtDate(n.date)}</span>
      </div>
      <div class="news-title">${t.title}</div>
      <div class="news-text">${t.text}</div>
    </div>`;
  }).join('') : `<p class="sub">${lang === 'fi' ? 'Ei uusia tiedotteita.' : 'No news right now.'}</p>`;

  renderSearch();

  $('myJobsList').innerHTML = mine.length ? mine.map(j => `
    <div class="${jobClass(j)}">
      <div>
        <div class="job-route">#${j.id} · ${j.from} → ${j.to}</div>
        <div class="job-meta">${j.car} · ${j.km} km · ${when(j)} · <span class="pill ${j.inspected ? 'green' : 'orange'}">${j.inspected ? (lang === 'fi' ? 'Tarkastettu' : 'Inspected') : (lang === 'fi' ? 'Odottaa tarkastusta' : 'Needs Inspection')}</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn outline" onclick="openInspection('${j.id}')">${lang === 'fi' ? 'Tarkastus' : 'Inspection'}</button>
        <button class="btn outline" onclick="openNav('${j.from}','${j.to}',${j.km})">${lang === 'fi' ? 'Reitti' : 'Route'}</button>
        <button class="btn green" onclick="completeJob('${j.id}')">${lang === 'fi' ? 'Merkitse toimitetuksi' : 'Mark Delivered'}</button>
      </div>
    </div>
  `).join('') : `<p class="sub">${lang === 'fi' ? 'Sinulla ei ole aktiivisia tehtäviä.' : 'You have no active jobs.'}</p>`;

  // Inspection: keep the chosen job if it is still active, otherwise the first active job.
  if (!mine.some(j => j.id === $('inspectJobSelect').value)) $('inspectJobSelect').value = mine.length ? mine[0].id : '';
  renderInspectTrip();

  $('inspectionLogs').innerHTML = state.inspections.map(l => `
    <div class="job">
      <div>
        <div class="job-route">#${l.jobId}</div>
        <div class="job-meta">${l.stage} · ${l.odo} km · ${l.fuel} · ${l.notes}</div>
        ${l.photos ? `<div class="log-photos">${Object.values(l.photos).map(src => `<img src="${src}" alt="">`).join('')}</div>` : ''}
      </div>
      <span class="pill green">OK</span>
    </div>
  `).join('');

  $('earningsTable').innerHTML = state.payouts.map(p => `
    <tr>
      <td>#${p.id}</td>
      <td>${p.driver}</td>
      <td>${p.status === 'paid' ? '<span class="pill green">Maksettu</span>' : '<span class="pill orange">Odottaa tilitystä</span>'}</td>
      <td><b>${ZemoStore.fmtEur(p.amount)}</b></td>

  `).join('');
}

// Hae: search open jobs by order number, city, car or date.
function renderSearch() {
  const q = ($('searchInput').value || '').trim().toLowerCase();
  const avail = ZemoStore.get().orders.filter(o => o.status === 'new' && !ZemoStore.isExpired(o)).sort(byTime);
  // Region filter: all regions that have open jobs.
  const regions = [...new Set(avail.map(j => j.region).filter(Boolean))].sort((x, y) => x.localeCompare(y, 'fi'));
  const chosen = regions.includes($('regionFilter').value) ? $('regionFilter').value : '';
  $('regionFilter').innerHTML = `<option value="">${lang === 'fi' ? 'Kaikki alueet' : 'All regions'} (${avail.length})</option>` +
    regions.map(r => `<option value="${r}" ${r === chosen ? 'selected' : ''}>${r} (${avail.filter(j => j.region === r).length})</option>`).join('');
  const hits = avail
    .filter(j => !chosen || j.region === chosen)
    .filter(j => !q || [j.id, j.from, j.to, j.region, j.car, j.date, ZemoStore.fmtDate(j.date)].join(' ').toLowerCase().includes(q));
  $('searchResults').innerHTML = hits.length ? hits.map(j => `
    <div class="${jobClass(j)}">
      <div>
        <div class="job-route">#${j.id} · ${j.from} → ${j.to}</div>
        <div class="job-meta">${j.region ? `<span class="pill">${j.region}</span> · ` : ''}${j.car} · ${j.km} km · ${when(j)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="job-pay">${ZemoStore.fmtEur(j.driverPay)}</span>
        <button class="btn" onclick="acceptJob('${j.id}')">${lang === 'fi' ? 'Hyväksy tehtävä' : 'Accept Job'}</button>
      </div>
    </div>
  `).join('') : `<p class="sub">${lang === 'fi' ? 'Ei hakutuloksia.' : 'No results.'}</p>`;
}
$('searchInput').addEventListener('input', renderSearch);
$('regionFilter').addEventListener('change', renderSearch);

// Re-check every minute so jobs disappear when their time passes.
setInterval(() => {
  const a = document.activeElement;
  if (!$('appView').classList.contains('hidden') && !(a && a.matches('input, select, textarea'))) renderAll();
}, 60000);

// Koti: tapping "Avoimet siirrot" opens the open jobs (Hae tab).
window.goToAvailable = function() {

};

// Full details of the trip shown at the top of the inspection form.
function renderInspectTrip() {
  const j = ZemoStore.get().orders.find(o => o.id === $('inspectJobSelect').value);
  if (!j) {
    $('inspectTrip').innerHTML = `<p class="sub" style="margin:0">${lang === 'fi' ? 'Ei aktiivisia tehtäviä' : 'No active jobs'}</p>`;

  }
  const fi = lang === 'fi';
  const rows = [
    [fi ? 'Noutopaikka' : 'Pickup', j.from],
    [fi ? 'Toimituspaikka' : 'Delivery', j.to],

    [fi ? 'Noutoaika' : 'Pickup time', when(j)],
    [fi ? 'Auto' : 'Car', j.car],
    [fi ? 'Matka' : 'Distance', j.km + ' km'],
    [fi ? 'Palkkiosi' : 'Your pay', ZemoStore.fmtEur(j.driverPay)],
    [fi ? 'Tarkastus' : 'Inspection', `<span class="pill ${j.inspected ? 'green' : 'orange'}">${j.inspected ? (fi ? 'Tarkastettu' : 'Inspected') : (fi ? 'Odottaa tarkastusta' : 'Needs Inspection')}</span>`]

  $('inspectTrip').innerHTML = `<div class="job-route">#${j.id} · ${j.from} → ${j.to}</div>` +

// Customer details and ways to contact them (call, SMS, WhatsApp, email).
function renderInspectCustomer(j) {
  const box = $('inspectCustomer'), fi = lang === 'fi';
  if (!j) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const c = Object.assign({ name: j.customer }, (ZemoStore.get().customers || []).find(x => x.name === j.customer));
  if (j.phone) c.phone = j.phone;   // number given in the order
  const rows = [
    [fi ? 'Nimi' : 'Name', c.name],
    [fi ? 'Asiakastyyppi' : 'Customer type', c.type === 'business' ? (fi ? 'Yritys' : 'Business') : c.type === 'private' ? (fi ? 'Yksityinen' : 'Private') : ''],
    [fi ? 'Yhteyshenkilö' : 'Contact person', c.contactPerson],
    [fi ? 'Puhelin' : 'Phone', c.phone],
    [fi ? 'Sähköposti' : 'Email', c.email]
  ].filter(r => r[1]);
  const tel = (c.phone || '').replace(/[^+\d]/g, '');
  const subject = encodeURIComponent((fi ? 'Auton siirto #' : 'Car transfer #') + j.id);
  const icon = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const btns = [
    tel && `<a class="call" href="tel:${tel}">${icon('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>')}${fi ? 'Soita' : 'Call'}</a>`,
    tel && `<a href="sms:${tel}">${icon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>')}${fi ? 'Tekstiviesti' : 'SMS'}</a>`,
    tel && `<a href="https://wa.me/${tel.replace('+', '')}" target="_blank" rel="noopener">${icon('<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3z"/>')}WhatsApp</a>`,
    c.email && `<a href="mailto:${c.email}?subject=${subject}">${icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')}${fi ? 'Sähköposti' : 'Email'}</a>`
  ].filter(Boolean);
  box.innerHTML = `<div class="trip-title">${fi ? 'Asiakkaan tiedot' : 'Customer details'}</div>` +
    rows.map(r => `<div class="trip-row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('') +
    (btns.length ? `<div class="contact-btns">${btns.join('')}</div>`
                 : `<p class="sub" style="margin:10px 0 0">${fi ? 'Asiakkaan yhteystiedot puuttuvat. Ota yhteys tukeen.' : 'No contact details. Contact support.'}</p>`);
}

function selectInspectJob(id) {
  if ($('inspectJobSelect').value !== id) clearPhotos();   // photos belong to one job
  $('inspectJobSelect').value = id;
  renderInspectTrip();
}

// ---- Inspection photos: odometer, front, right, left, rear (+2 extra) ----
const REQUIRED_PHOTOS = ['odometer', 'front', 'right', 'left', 'rear'];
let photos = {};

// Shrink a photo to max 480 px so it fits in the browser's storage.
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 480 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.6));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

function clearPhotos() {
  photos = {};
  document.querySelectorAll('.photo-slot').forEach(sl => {
    sl.classList.remove('done', 'missing');
    sl.querySelector('img')?.remove();
    sl.querySelector('input').value = '';
  });
}

function setPhoto(sl, src) {
  photos[sl.dataset.slot] = src;
  let img = sl.querySelector('img');
  if (!img) { img = document.createElement('img'); img.alt = ''; sl.prepend(img); }
  img.src = src;
  sl.classList.add('done');
  sl.classList.remove('missing');
}

// Photo from the phone's own camera app or gallery (fallback).
document.querySelectorAll('.photo-slot input').forEach(inp => inp.addEventListener('change', async () => {
  const sl = inp.closest('.photo-slot'), file = inp.files[0];
  if (!file) return;
  try {
    setPhoto(sl, await shrinkPhoto(file));
  } catch (e) {
    showToast(lang === 'fi' ? 'Kuvaa ei voitu lukea. Yritä uudelleen.' : 'Could not read the photo. Try again.');
  }
}));

// Tapping a photo box opens the phone camera right away (the tap itself opens it, so every phone allows it).
// If this site already has camera permission, the camera opens inside the app with the guide picture instead.
let camStream = null, camSlot = null, camFailed = false, camGranted = false;
try {
  navigator.permissions.query({ name: 'camera' }).then(st => {
    camGranted = st.state === 'granted';
    st.onchange = () => { camGranted = st.state === 'granted'; };
  }).catch(() => {});
} catch (e) {}
function inAppCameraPossible() {
  return camGranted && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) &&
    !(document.featurePolicy && !document.featurePolicy.allowsFeature('camera'));
}
document.querySelectorAll('.photo-slot').forEach(sl => sl.addEventListener('click', e => {
  if (e.target.tagName === 'INPUT') return;
  if (!inAppCameraPossible()) {
    sl.querySelector('input').setAttribute('capture', 'environment');   // the box's own tap opens the phone camera
    return;
  }
  e.preventDefault();
  openCamera(sl);
}));

async function openCamera(sl) {
  camSlot = sl;
  camFailed = false;
  $('camTitle').textContent = sl.querySelector('.cap').textContent;
  // Guide picture: copy of the box's picture (ids renamed so they stay unique).
  $('camGuide').innerHTML = (sl.querySelector('svg')?.outerHTML || '')
    .replace(/id="(\w+)"/g, 'id="$1Cam"').replace(/url\(#(\w+)\)/g, 'url(#$1Cam)');
  $('camMsg').classList.add('hidden');
  $('camFile').textContent = lang === 'fi' ? 'Galleria' : 'Gallery';
  $('camShot').disabled = true;
  $('camView').classList.remove('hidden');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
    if (camSlot !== sl) { stream.getTracks().forEach(t => t.stop()); return; }   // closed while waiting
    camStream = stream;
    $('camVideo').srcObject = stream;
    await $('camVideo').play().catch(() => {});
    $('camShot').disabled = false;
  } catch (err) {
    if (camSlot === sl) cameraFailed();
  }
}

function cameraFailed() {
  camFailed = true;
  $('camMsg').textContent = lang === 'fi'
    ? 'Kameraa ei voitu avata tässä. Salli kameran käyttö selaimen asetuksista tai käytä puhelimen kameraa.'
    : 'The camera could not be opened here. Allow camera access in the browser settings or use the phone camera.';
  $('camMsg').classList.remove('hidden');
  $('camFile').textContent = lang === 'fi' ? 'Puhelimen kamera' : 'Phone camera';
}

function closeCamera() {
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  camSlot = null;
  $('camVideo').srcObject = null;
  $('camView').classList.add('hidden');
}

$('camShot').addEventListener('click', () => {
  const v = $('camVideo');
  if (!camSlot || !v.videoWidth) return;
  const k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  setPhoto(camSlot, c.toDataURL('image/jpeg', 0.6));
  closeCamera();
});
$('camClose').addEventListener('click', closeCamera);
// Gallery, or the phone's own camera app if the in-app camera is not available.
$('camFile').addEventListener('click', () => {
  const inp = camSlot.querySelector('input'), useCamera = camFailed;
  closeCamera();
  if (useCamera) inp.setAttribute('capture', 'environment'); else inp.removeAttribute('capture');
  inp.click();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('camView').classList.contains('hidden')) closeCamera(); });

// Title follows the inspection stage.
function updatePhotoTitle() {
  const t = $('photoTitle'), pickup = $('stageInput').value === 'pickup';
  t.dataset.fi = pickup ? 'Kuvat ennen ajoa' : 'Kuvat perillä';
  t.dataset.en = pickup ? 'Photos before driving' : 'Photos at delivery';
  t.textContent = t.dataset[lang];
}
$('stageInput').addEventListener('change', updatePhotoTitle);

window.openInspection = function(id) {
  selectInspectJob(id);
  switchTab('inspection');
};

window.acceptJob = function(id) {
  const state = ZemoStore.get();
  const job = state.orders.find(o => o.id === id);
  if (!job) return;
  if (job.status !== 'new' || ZemoStore.isExpired(job)) {
    renderAll();
    showToast(lang === 'fi' ? 'Tehtävän aika on umpeutunut.' : 'This job has expired.');
    return;
  }
  job.driver = DRIVER_NAME;
  job.status = 'transit';
  ZemoStore.save(state);
  renderAll();
  showToast(lang === 'fi' ? `Tehtävä #${id} hyväksytty!` : `Job #${id} accepted!`);
};

window.openNav = function(from, to, km) {
  $('navFrom').textContent = `${from} — Noutopiste`;
  $('navTo').textContent = `${to} — Toimituspiste (${km} km)`;
  $('gmapsLink').href = `https://www.google.com/maps/dir/${encodeURIComponent(from)}/${encodeURIComponent(to)}`;
  switchTab('navigation');
};

window.completeJob = function(id) {
  const state = ZemoStore.get();
  const job = state.orders.find(o => o.id === id);
  if (!job) return;
  if (!job.inspected) {
    showToast(lang === 'fi' ? 'Suorita auton tarkastus ennen luovutusta!' : 'Complete vehicle inspection first!');
    selectInspectJob(id);
    switchTab('inspection');
    return;
  }
  job.status = 'delivered';
  state.payouts.unshift({
    id: job.id,
    driver: DRIVER_NAME,
    iban: 'FI21 1234 5600 0007 85',
    amount: job.driverPay,
    status: 'pending'
  });
  ZemoStore.save(state);
  renderAll();
  showToast(lang === 'fi' ? `Siirto #${id} valmis! Palkkio lähetetty tilitykseen.` : `Transfer #${id} completed! Payout queued.`);
};

function switchTab(tabId) {
  // Inspection and navigation belong to "Omat ajot", earnings to "Profiili".
  const navTab = { inspection: 'myjobs', navigation: 'myjobs', earnings: 'profile' }[tabId] || tabId;
  document.querySelectorAll('#driverNav button').forEach(b => b.classList.toggle('active', b.dataset.tab === navTab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('hidden', p.id !== tabId));
  window.scrollTo(0, 0);
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('logoutBtn')?.classList.remove('hidden');
  $('driverStatusBadge')?.classList.remove('hidden');
  renderAll();
  showToast(lang === 'fi' ? 'Tervetuloa kuljettajaportaaliin!' : 'Welcome to Driver Portal!');
});

// Next sign-in starts on Koti; after logging out, go back to the swipe screen of the main page.
$('logoutBtn')?.addEventListener('click', () => {
  switchTab('available');
  if (window.parent !== window) parent.postMessage({ zemoGo: 'start', splash: true }, '*');
  else window.location.href = 'index.html';
});
$('logoutBtn')?.addEventListener('click', () => {
  $('appView').classList.add('hidden');
  $('logoutBtn')?.classList.add('hidden');
  $('driverStatusBadge')?.classList.add('hidden');
  $('loginView').classList.remove('hidden');
});

document.querySelectorAll('#driverNav button').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

$('inspectionForm').addEventListener('submit', e => {
  e.preventDefault();
  const jobId = $('inspectJobSelect').value;
  if (!jobId) return;
  const missing = REQUIRED_PHOTOS.filter(k => !photos[k]);
  if (missing.length) {
    missing.forEach(k => document.querySelector(`.photo-slot[data-slot="${k}"]`).classList.add('missing'));
    document.querySelector(`.photo-slot[data-slot="${missing[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast(lang === 'fi' ? 'Ota kaikki pakolliset kuvat (*).' : 'Take all required photos (*).');
    return;
  }
  const state = ZemoStore.get();
  const job = state.orders.find(o => o.id === jobId);
  if (job) job.inspected = true;
  state.inspections.unshift({
    jobId: jobId,
    stage: $('stageInput').value,
    odo: $('odoInput').value,
    fuel: $('fuelInput').value,
    notes: $('inspectNotes').value || 'OK',
    photos: Object.assign({}, photos)
  });
  ZemoStore.save(state);
  clearPhotos();
  renderAll();
  showToast(lang === 'fi' ? 'Tarkastusraportti tallennettu.' : 'Inspection report saved.');
});

$('profileForm').addEventListener('submit', e => {
  e.preventDefault();
  showToast(lang === 'fi' ? 'Profiili päivitetty.' : 'Profile updated.');
});

window.addEventListener('storage', renderAll);

$('langBtn')?.addEventListener('click', () => {
  lang = lang === 'fi' ? 'en' : 'fi';
  document.documentElement.lang = lang;
  $('langBtn').textContent = lang === 'fi' ? 'EN' : 'FI';
  document.querySelectorAll('[data-fi]').forEach(el => {
    if (el.dataset[lang]) el.textContent = el.dataset[lang];
  });
  renderAll();
});
<\/script>
</body>
</html>

</script>

<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zemo Siirto — Hallintapaneeli (Admin)</title>
<style>
:root{
  --bg:#0b1015;--panel:#131b23;--panel2:#19232d;--line:#293642;
  --ink:#f4f7fa;--muted:#9baab7;--orange:#f28a45;--green:#6bd1a0;--blue:#8ebcff;--red:#f26b6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1240px)/2));background:#0d1319;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.14em;text-decoration:none;color:inherit}
.mark{width:38px;height:38px;border:2px solid var(--orange);border-radius:11px;display:grid;place-items:center;color:var(--orange);font-size:19px;transform:skew(-7deg)}
.mark-logo{height:44px;width:auto;display:block;border-radius:9px}
.brand small{display:block;font-size:9px;color:var(--red);letter-spacing:.22em}
.topright{display:flex;gap:10px;align-items:center}
.lang,.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:9px;font-size:13px;text-decoration:none}
.ghost:hover,.lang:hover{border-color:#4b5d6e}
.admin-badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 11px;font-size:11px;font-weight:800;background:#3a1d22;color:#ff9e9e}

.login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:24px}
.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.login-card h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}

.wrap{width:min(1240px,calc(100% - 36px));margin:auto;padding:24px 0 60px}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.nav button{background:#151f28;color:#c3cfd9;border:1px solid var(--line);padding:10px 14px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.nav button.active{background:var(--orange);color:#17110d;border-color:var(--orange)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin-bottom:18px}
.card h2{margin:0 0 6px;font-size:19px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:13px}
.stat b{font-size:24px;display:block}
.stat span{font-size:12px;color:var(--muted)}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:grid;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#c3cdd5;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:#0c1319;border:1px solid #34414d;color:var(--ink);border-radius:9px;padding:10px 12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--orange)}
.btn{border:0;border-radius:9px;background:var(--orange);color:#1b120d;font-weight:900;padding:11px 16px;font-size:13px}
.btn:hover{filter:brightness(1.07)}
.btn.block{width:100%;margin-top:14px}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn.green{background:var(--green);color:#0b2217}
.btn.red{background:var(--red);color:#260b0b}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;padding:4px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#26333e;color:#c9d8e3}
.pill.orange{background:#4a3021;color:#ffbd8e}
.pill.blue{background:#1b324b;color:#8ebcff}
.pill.green{background:#1c3a30;color:#a8f0ce}
.pill.red{background:#3a1d22;color:#ff9e9e}
.res-input{background:#0c1319;border:1px solid #34414d;color:var(--ink);border-radius:7px;padding:6px 8px}

.toast{position:fixed;bottom:20px;right:20px;background:#1c3b30;border:1px solid #34795b;color:#c4f3d9;padding:13px 17px;border-radius:10px;display:none;z-index:50;max-width:340px;font-size:13px}
@media(max-width:900px){.statgrid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
@media(max-width:540px){.statgrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
</head>
